version: '3.8'

# Single-node Cassandra for the demo. The Spring Boot app is started by
# ./start.sh (or the systemDesign launcher) after Cassandra is healthy.

services:
  cassandra:
    image: cassandra:4.1
    container_name: cassandra-node1
    environment:
      CASSANDRA_CLUSTER_NAME: "CassandraCluster"
      CASSANDRA_DC: "datacenter1"
      CASSANDRA_RACK: "rack1"
      CASSANDRA_NUM_TOKENS: 256
      # Keep the JVM heap small so the node fits in Docker Desktop's memory budget.
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "100M"
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - cassandra-net

networks:
  cassandra-net:
    driver: bridge