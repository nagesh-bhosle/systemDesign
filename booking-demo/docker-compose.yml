services:
  booking-db:
    image: postgres:16-alpine
    container_name: booking-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking123
    volumes:
      - booking-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  booking-redis:
    image: redis:7-alpine
    container_name: booking-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  booking-pgdata:
